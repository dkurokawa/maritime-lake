[project]
name = "maritime-lake"
version = "0.1.0"
description = "Open, reproducible lakehouse for global shipping chokepoints (IMF PortWatch)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyyaml>=6",
    "searoute>=1.6.0",
]

[project.scripts]
mlake = "mlake.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/mlake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
