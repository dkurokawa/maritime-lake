[project]
name = "maritime-lake"
version = "0.1.0"
description = "Open, reproducible lakehouse for global shipping chokepoints (IMF PortWatch)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyyaml>=6",
    "searoute>=1.6.0",
]

[project.scripts]
mlake = "mlake.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/mlake"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["searoute.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mlake"]
